<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/loginstyles.css">
  <link rel="stylesheet" href="../css/componentes/notificaciones.css">
  <link rel="stylesheet" href="../css/reset-password.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <title>Restablecer contraseña</title>
</head>

<body>
<div class="login-box">
  <form id="reset-form">
    <div class="form-content">width:200px;">

      <h1 style="color:#000;text-align:center;font-size:1.5rem;margin-bottom:10px;">
        Restablecer contraseña
      </h1>

      <p id="info" style="text-align:center;margin-bottom:10px;"></p>

      <div class="input-box">
        <span class="icon">
          <i class="fa-solid fa-lock"></i>
        </span>
        <input type="password" id="newPassword" required minlength="6" placeholder="Nueva contraseña">
        <label for="newPassword">Nueva contraseña</label>
      </div>

      <button type="submit">Cambiar contraseña</button>

      <p id="message" style="text-align:center;margin-top:10px;"></p>

      <div class="link" style="text-align:center;margin-top:10px;">
        <a href="index.html">Volver al inicio</a>
      </div>
    </div>
  </form>
</div>

<div id="notifications" class="notification-container"></div>

<script type="module" src="../js/reset-password.js"></script>
</body>
</html>
